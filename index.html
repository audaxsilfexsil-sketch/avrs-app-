*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0908;
  --bg2:#100f0d;
  --bg3:#161412;
  --bg4:#1d1b18;
  --bg5:#242220;
  --gold:#c8a96d;
  --gold2:#e2c48a;
  --gold3:#f0d9a8;
  --cream:#f5f0e8;
  --text:#ede8df;
  --text2:#9a9088;
  --text3:#4a4640;
  --border:rgba(200,169,109,0.12);
  --border2:rgba(200,169,109,0.22);
  --ok:#1D9E75;--ok-bg:rgba(29,158,117,.12);--ok-text:#5DCAA5;
  --warn:#BA7517;--warn-bg:rgba(186,117,23,.12);--warn-text:#EF9F27;
  --danger:#A32D2D;--danger-bg:rgba(163,45,45,.12);--danger-text:#F09595;
  --r:18px;
  --r2:14px;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'DM Sans',sans-serif;color:var(--text)}

.app{
  max-width:430px;margin:0 auto;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
}

/* SPLASH */
.splash{
  position:absolute;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:48px 40px;z-index:999;
  transition:opacity 1.2s ease;
}
.splash.hide{opacity:0;pointer-events:none}
.splash-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:52px;font-weight:300;
  letter-spacing:.3em;color:var(--gold);
  margin-bottom:4px;
}
.splash-subtitle{
  font-size:10px;letter-spacing:.25em;
  text-transform:uppercase;color:var(--text3);
  margin-bottom:48px;
}
.splash-quote{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;font-weight:300;font-style:italic;
  color:var(--text2);text-align:center;
  line-height:1.8;max-width:280px;
  margin-bottom:48px;
}
.breath-ring{
  width:80px;height:80px;border-radius:50%;
  border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  animation:breathe 4s ease-in-out infinite;
}
.breath-inner{
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(200,169,109,.4);
  display:flex;align-items:center;justify-content:center;
}
.breath-dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:.6}
  50%{transform:scale(1.15);opacity:1}
}
.breath-label{
  margin-top:16px;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--text3);
}
</style>
